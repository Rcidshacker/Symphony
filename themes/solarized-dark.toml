# Solarized Dark Theme
# Precision color scheme

name = "solarized-dark"
author = "Ethan Schoonover"
description = "Precision color scheme"

[ui]
background = "#073642"
foreground = "#fdf6e3"
border = "#002b36"
text = "#fdf6e3"
text_dim = "#93a1a1"
selection_bg = "#002b36"
selection_fg = "#fdf6e3"

[spectrum]
sub_bass = "#dc322f"     # Red
bass = "#cb4b16"         # Orange
mid_low = "#b58900"      # Yellow
mid = "#859900"          # Green
mid_high = "#2aa198"     # Cyan
high = "#268bd2"         # Blue
treble = "#6c71c4"       # Violet
beat_pulse = "#eee8d5"

[accents]
primary = "#268bd2"      # Blue
secondary = "#2aa198"    # Cyan
success = "#859900"      # Green
warning = "#b58900"      # Yellow
error = "#dc322f"        # Red
info = "#2aa198"         # Cyan
